<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#050505">
<meta name="description" content="VolumeShaderBM GPU Shader Performance Test">
<title>VolumeShaderBM — GPU Shader Performance Test</title>
<style>
:root{--bg:#000;--panel:rgba(8,8,10,.72);--line:#24262b;--text:#f4f4f5;--muted:#9b9ba3}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#000;color:var(--text);font-family:Arial,Helvetica,sans-serif}
#shader{position:fixed;inset:0;width:100%;height:100%;border:0;z-index:0;background:#000}
.vignette{position:fixed;inset:0;z-index:1;pointer-events:none;background:radial-gradient(circle at 50% 48%,transparent 28%,rgba(0,0,0,.16) 72%,rgba(0,0,0,.52))}
.ui{position:fixed;inset:0;z-index:5;pointer-events:none;padding:clamp(18px,4vw,42px);display:flex;flex-direction:column}
.top{display:flex;align-items:flex-start;justify-content:space-between;gap:18px}
.brand h1{font-size:clamp(25px,4.8vw,42px);margin:0;font-weight:700;letter-spacing:-1.4px}
.brand .red{color:#ff2b36}.brand .white{color:#fff}
.brand p{margin:7px 0 0;color:#9ca0a8;font-size:clamp(10px,1.7vw,16px);letter-spacing:.4px}
.music,.card,.mode,.action,.credit{pointer-events:auto;background:var(--panel);backdrop-filter:blur(9px);-webkit-backdrop-filter:blur(9px);border:1px solid #25272b;box-shadow:0 0 0 1px rgba(255,255,255,.015) inset}
.music{border-radius:10px;padding:13px 19px;font-size:14px;min-width:148px;color:#eee;cursor:pointer}
.music b{font-size:22px;vertical-align:-2px;margin-right:10px}
.stats{display:flex;justify-content:space-between;align-items:flex-start;margin-top:34px;gap:14px}
.left{display:flex;flex-direction:column;gap:12px;width:185px}.right{width:135px}
.card{border-radius:11px;padding:14px 19px;min-height:86px}
.card .label{font-size:12px;color:#e7e7e8;margin-bottom:9px}
.card .value{font-size:21px;font-weight:700}
.green{color:#00ff55}.blue{color:#10a9ff}.purple{color:#b54cff}.yellow{color:#ffd21a}
.fps{text-align:center;min-height:145px;padding-top:20px}.fps .value{font-size:54px;line-height:1;color:#62ff00;margin:8px 0}.fps .unit{font-size:16px;color:#eee}
.spacer{flex:1}
.modes{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin:0 auto 22px;width:min(780px,100%)}
.mode{border-radius:11px;padding:18px 8px;text-align:center;font-size:14px;font-weight:700;cursor:pointer;transition:.18s}
.mode:hover{transform:translateY(-2px)} .mode.active{box-shadow:0 0 18px rgba(0,255,100,.16) inset}
.mode:nth-child(1){color:#16aefb;border-color:#128fd2}.mode:nth-child(2){color:#24ef53;border-color:#20a842}.mode:nth-child(3){color:#ffd20b;border-color:#b28b00}.mode:nth-child(4){color:#c84cff;border-color:#8727a8}
.actions{display:grid;grid-template-columns:1fr 1fr;gap:18px;margin:0 auto 24px;width:min(780px,100%)}
.action{border-radius:11px;min-height:70px;font-size:17px;font-weight:700;cursor:pointer;color:#fff}
.action.full{border-color:#6b7078}.action.stop{border-color:#e1262f;color:#ff3d45}.action.stop.running{background:rgba(100,0,0,.12)}
.credit{border-radius:9px;text-align:center;padding:19px 10px;margin:0 auto;width:min(780px,100%);font-size:18px;font-weight:700;position:relative;overflow:hidden}
.credit:after{content:"";position:absolute;left:0;right:0;bottom:0;height:3px;background:linear-gradient(90deg,#ff2b2b,#ff9f00,#fff000,#25ef42,#00b8ff,#4b36ff,#ff27df,#ff2b2b);background-size:200% 100%;animation:rainbow 3s linear infinite}
@keyframes rainbow{to{background-position:200% 0}}
@media(max-width:650px){
 .ui{padding:18px 24px 16px}
 .music{padding:11px 13px;min-width:126px}.brand h1{font-size:27px}.brand p{font-size:10px}
 .stats{margin-top:26px}.left{width:184px}.right{width:115px}.card{padding:12px 14px;min-height:75px}.card .value{font-size:19px}.fps{min-height:128px}.fps .value{font-size:44px}
 .modes{gap:10px;margin-bottom:16px}.mode{padding:15px 4px;font-size:12px}
 .actions{gap:12px;margin-bottom:14px}.action{min-height:60px;font-size:15px}.credit{padding:15px 7px;font-size:15px}
}
@media(max-width:480px){
 .ui{padding:14px 24px 12px}.top{gap:8px}.music{font-size:11px;min-width:102px;padding:10px}.music b{font-size:18px;margin-right:6px}
 .stats{margin-top:22px}.left{width:145px;gap:8px}.right{width:105px}.card{min-height:64px;padding:9px 11px}.card .label{font-size:10px;margin-bottom:5px}.card .value{font-size:16px}.fps{min-height:110px;padding-top:13px}.fps .value{font-size:36px}
 .modes{gap:7px}.mode{padding:12px 2px;font-size:10px}.actions{gap:8px}.action{min-height:52px;font-size:13px}.credit{font-size:13px;padding:13px 4px}
}
</style>
</head>
<body>
<iframe id="shader" src="volumeshader.html" title="Volume Shader GPU renderer"></iframe>
<div class="vignette"></div>
<audio id="bgMusic" src="music/volume-theme.wav" loop preload="auto"></audio>

<div class="ui">
  <div class="top">
    <div class="brand">
      <h1>Volume<span class="red">Shader</span><span class="white">BM</span></h1>
      <p>GPU SHADER PERFORMANCE TEST</p>
    </div>
    <button class="music" id="music"><b>♫</b> MUSIC: <span>ON</span></button>
  </div>

  <div class="spacer"></div>
  <div class="modes">
    <button class="mode" data-mode="SIMPLE">✦<br><span>SIMPLE</span></button>
    <button class="mode active" data-mode="STANDARD">◉<br><span>STANDARD</span></button>
    <button class="mode" data-mode="ADVANCED">⬡<br><span>ADVANCED</span></button>
    <button class="mode" data-mode="EXTREME">✥<br><span>EXTREME</span></button>
  </div>
  <div class="actions">
    <button class="action full" id="full">⛶ &nbsp; FULLSCREEN</button>
    <button class="action stop running" id="stop">■ &nbsp; STOP</button>
  </div>
  <div class="credit">Developed by <span style="color:#ff8a00">(</span><span style="color:#19ef3c">Mr Captain Ofc</span><span style="color:#b62cff">)</span></div>
</div>

<script>
const frame=document.getElementById('shader');
let running=true, music=false;
const bgMusic=document.getElementById('bgMusic');
document.querySelectorAll('.mode').forEach(btn=>btn.onclick=()=>{
 document.querySelectorAll('.mode').forEach(x=>x.classList.remove('active'));btn.classList.add('active');
});
document.getElementById('music').onclick=()=>{
 music=!music; document.querySelector('#music span').textContent=music?'ON':'OFF'; if(music){bgMusic.play().catch(()=>{})}else{bgMusic.pause();}
};
document.getElementById('stop').onclick=()=>{
 running=!running;
 document.getElementById('stop').innerHTML=running?'■ &nbsp; STOP':'▶ &nbsp; START';
 document.getElementById('stop').classList.toggle('running',running);
 try{frame.contentWindow.postMessage({type:running?'start':'stop'},'*')}catch(e){}
};
document.getElementById('full').onclick=()=>{
 if(!document.fullscreenElement) document.documentElement.requestFullscreen?.();
 else document.exitFullscreen?.();
};
window.addEventListener('keydown',e=>{if(e.key==='f'||e.key==='F')document.getElementById('full').click()});
</script>
</body>
</html>
